<!DOCTYPE html>
<html lang="es" class="h-full bg-[#F2F2F2]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project_name }} - Cambio de Contraseña</title>
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #F2F2F2 0%, #E2E2E2 100%);
        }

        .glass-login {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px -15px rgba(38, 37, 35, 0.1);
        }
    </style>
</head>

<body class="h-full flex items-center justify-center p-4">

    <div class="w-full max-w-md glass-login rounded-3xl overflow-hidden relative">
        <div class="h-2 w-full bg-gradient-to-r from-[#049DD9] via-[#79F2E6] to-[#262523]"></div>

        <div class="p-8 md:p-10">
            <div class="text-center mb-6">
                <div class="inline-flex h-16 items-center justify-center mb-4">
                    <img src="/static/images/logo.png" alt="Logo" class="max-h-full w-auto object-contain">
                </div>
                <h1 class="text-lg font-bold text-[#262523]">Cambie su contraseña</h1>
                <p class="text-xs text-[#8C8C8C] mt-2 leading-relaxed">
                    Hola <span class="font-semibold text-[#262523]">{{ user.full_name }}</span>, ingresó con una
                    contraseña temporal. Defina una contraseña personal para continuar.
                </p>
            </div>

            <form id="change-pw-form" onsubmit="handleChange(event)" class="space-y-4">
                <div>
                    <label for="old-password" class="block text-xs font-semibold text-[#262523] uppercase tracking-wider mb-2">Contraseña temporal</label>
                    <input type="password" id="old-password" required autocomplete="current-password"
                        class="w-full text-sm bg-white rounded-xl px-4 py-3 border border-gray-200 focus:outline-none focus:border-[#049DD9] focus:ring-1 focus:ring-[#049DD9] transition-all">
                </div>
                <div>
                    <label for="new-password" class="block text-xs font-semibold text-[#262523] uppercase tracking-wider mb-2">Nueva contraseña</label>
                    <input type="password" id="new-password" required minlength="8" maxlength="50" autocomplete="new-password"
                        class="w-full text-sm bg-white rounded-xl px-4 py-3 border border-gray-200 focus:outline-none focus:border-[#049DD9] focus:ring-1 focus:ring-[#049DD9] transition-all">
                    <p class="text-[10px] text-[#8C8C8C] mt-1.5">Mínimo 8 caracteres, con letras y números.</p>
                </div>
                <div>
                    <label for="confirm-password" class="block text-xs font-semibold text-[#262523] uppercase tracking-wider mb-2">Confirmar nueva contraseña</label>
                    <input type="password" id="confirm-password" required minlength="8" maxlength="50" autocomplete="new-password"
                        class="w-full text-sm bg-white rounded-xl px-4 py-3 border border-gray-200 focus:outline-none focus:border-[#049DD9] focus:ring-1 focus:ring-[#049DD9] transition-all">
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full bg-[#049DD9] text-white rounded-xl py-3 px-4 text-sm font-semibold hover:bg-[#049DD9]/90 shadow-lg shadow-[#049DD9]/25 transition-all flex items-center justify-center space-x-2">
                    <span id="btn-text">Guardar y continuar</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
                <button type="button" onclick="handleLogout()"
                    class="w-full text-xs text-[#8C8C8C] hover:text-[#049DD9] font-semibold transition-colors">Cerrar sesión</button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 max-w-sm w-full pointer-events-none"></div>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'border-[#049DD9]' : 'border-red-500';
            toast.className = `pointer-events-auto bg-white border-l-4 ${color} rounded-xl shadow-lg px-4 py-3 text-xs text-[#262523]`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function postJSON(url, body) {
            return fetch(url, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': getCookie('csrf_token') || '' },
                body: body ? JSON.stringify(body) : undefined
            });
        }

        async function handleChange(e) {
            e.preventDefault();
            const old_password = document.getElementById('old-password').value;
            const new_password = document.getElementById('new-password').value;
            const confirm_password = document.getElementById('confirm-password').value;

            if (new_password !== confirm_password) {
                showToast('La confirmación de la contraseña no coincide.', 'error');
                return;
            }
            if (new_password.length < 8 || !/[A-Za-z]/.test(new_password) || !/\d/.test(new_password)) {
                showToast('La nueva contraseña debe tener al menos 8 caracteres, con letras y números.', 'error');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            try {
                let response = await postJSON('/api/auth/change-password', { old_password, new_password });
                if (response.status === 401) {
                    await postJSON('/api/auth/refresh');
                    response = await postJSON('/api/auth/change-password', { old_password, new_password });
                }
                const data = await response.json().catch(() => ({}));
                if (response.ok) {
                    showToast('Contraseña actualizada. Ingresando...', 'success');
                    setTimeout(() => { window.location.href = '/'; }, 1000);
                } else {
                    const detail = Array.isArray(data.detail) ? 'La contraseña no cumple los requisitos.' : data.detail;
                    showToast(detail || 'No se pudo cambiar la contraseña.', 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                showToast('Falla de comunicación con el servidor.', 'error');
                btn.disabled = false;
            }
        }

        async function handleLogout() {
            try { await postJSON('/api/auth/logout'); } catch (e) { }
            window.location.href = '/login';
        }
    </script>
</body>

</html>
